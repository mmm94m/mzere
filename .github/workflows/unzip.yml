name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q AshteMobile-main.zip
          rm -rf AshteMobile-main/.github/workflows
          cp -a AshteMobile-main/. .
          rm -rf AshteMobile-main AshteMobile-main.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project"
          git push
